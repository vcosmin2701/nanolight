# Tests Nanolight and builds its app on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig fmt --check build.zig src
      - run: zig build test
      - run: zig build app -Doptimize=ReleaseSafe
